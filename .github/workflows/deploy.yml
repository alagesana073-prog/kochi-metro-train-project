# Deploy frontend to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env file
        working-directory: frontend
        run: |
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyDCLKUeKK044Z5lQnOTVEVKO-TrHLI5O3I
          VITE_FIREBASE_AUTH_DOMAIN=kochi-metro-train-projec-25477.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=kochi-metro-train-projec-25477
          VITE_FIREBASE_STORAGE_BUCKET=kochi-metro-train-projec-25477.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=280630190458
          VITE_FIREBASE_APP_ID=1:280630190458:web:c5e1413f5b4371eb5db6c3
          VITE_FIREBASE_MEASUREMENT_ID=G-LY06XJ4W9W
          EOF

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
